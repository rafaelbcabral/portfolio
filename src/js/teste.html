<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educação e Experiência</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-2xl">
        <div class="flex space-x-4 mb-6 border-b">
            <button id="btn-educacao" class="pb-2 px-4 text-green-600 font-semibold border-b-2 border-green-600">
                Educação
            </button>
            <button id="btn-trabalho" class="pb-2 px-4 text-gray-500 font-semibold">
                Trabalho
            </button>
        </div>
        
        <div id="educacao-content">
            <h1 class="text-2xl font-bold mb-4">Educação</h1>
            
            <div class="mb-6">
                <h2 class="text-lg font-semibold">Estagiário Frontend</h2>
                <p class="text-gray-700">Cirtus ERP</p>
                <p class="text-gray-500">2021-2023</p>
            </div>
            
            <div class="mb-6">
                <h2 class="text-lg font-semibold">Desenvolvedor</h2>
                <h3 class="text-md font-medium">FullStack</h3>
                <p class="text-gray-700">A4PM</p>
                <p class="text-gray-500">2024-presente</p>
            </div>
            
            <div class="border-t border-gray-300 my-6"></div>
            
            <div class="mb-6">
                <h2 class="text-lg font-semibold">Programador Full Stack</h2>
                <p class="text-gray-700">Cirtus ERP</p>
                <p class="text-gray-500">2023 - 2024</p>
            </div>
        </div>
        
        <div id="trabalho-content" class="hidden">
            <!-- Conteúdo de trabalho seria adicionado aqui -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const btnEducacao = document.getElementById('btn-educacao');
            const btnTrabalho = document.getElementById('btn-trabalho');
            const educacaoContent = document.getElementById('educacao-content');
            const trabalhoContent = document.getElementById('trabalho-content');
            
            btnEducacao.addEventListener('click', function() {
                // Ativa o botão Educação
                btnEducacao.classList.add('text-green-600', 'border-green-600');
                btnEducacao.classList.remove('text-gray-500');
                
                // Desativa o botão Trabalho
                btnTrabalho.classList.remove('text-green-600', 'border-green-600');
                btnTrabalho.classList.add('text-gray-500');
                
                // Mostra conteúdo de Educação, esconde o de Trabalho
                educacaoContent.classList.remove('hidden');
                trabalhoContent.classList.add('hidden');
            });
            
            btnTrabalho.addEventListener('click', function() {
                // Ativa o botão Trabalho
                btnTrabalho.classList.add('text-green-600', 'border-green-600');
                btnTrabalho.classList.remove('text-gray-500');
                
                // Desativa o botão Educação
                btnEducacao.classList.remove('text-green-600', 'border-green-600');
                btnEducacao.classList.add('text-gray-500');
                
                // Mostra conteúdo de Trabalho, esconde o de Educação
                trabalhoContent.classList.remove('hidden');
                educacaoContent.classList.add('hidden');
            });
        });
    </script>
</body>
</html>
